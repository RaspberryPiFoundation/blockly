name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — print the version and npm dist-tag that would be used; no commit or publish.
          Pick the branch to publish from with the "Use workflow from" dropdown.
          Non-default branches publish to the npm dist-tag `beta` (not `latest`).
        required: false
        default: false
        type: boolean
      skip_versioning:
        description: >
          Skip version bump — use the version already in the repo
          (e.g. retry after npm publish failed but the release commit is already pushed).
        required: false
        default: false
        type: boolean
      version_override:
        description: >
          Optional. Full semver to publish (e.g. 12.6.0-beta.2). Skips conventional bump when set.
          Leave empty for automatic versioning.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/build.yml

  dry-run:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: ${{ !inputs.skip_versioning }}
        run: npm ci

      - name: Dry run summary
        run: |
          DIST_TAG="${{ github.ref_name == github.event.repository.default_branch && 'latest' || 'beta' }}"
          RELEASE_VERSIONS=$(npx lerna version --yes --exact --conventional-commits --no-git-tag-version --no-push --no-changelog)
          echo "Dry run: would publish the following versions to npm dist-tag: ${DIST_TAG}"
          echo "${RELEASE_VERSIONS}"
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "GitHub release would be created as prerelease."
          fi

  publish:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    environment: release
    env:
      NPM_DIST_TAG: ${{ github.ref_name == github.event.repository.default_branch && 'latest' || 'beta' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        working-directory: packages/blockly
        run: npm run package

      # We need to split out versioning between core and plugins as we only want 
      # changelogs for plugins and lerna does not have a per-package
      # configuration option for the version command.
      - name: Version core
        if: ${{ !inputs.skip_versioning }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        # If we're on the default branch, do a package release. Otherwise, do a 
        # prerelease (beta)
        run: |
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            npx lerna version "${VERSION_OVERRIDE}" --conventional-commits --no-git-tag-version --scope "packages/blockly" --no-changelog --yes --loglevel silly
          else
            npm lerna version "${VERSION_OVERRIDE}" --conventional-prerelease --preid beta --scope "packages/blockly" --no-changelog --no-git-tag-version --yes --loglevel silly
          fi

      - name: Version plugins
        if: ${{ !inputs.skip_versioning }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        # If we're on the default branch, do a package release. Otherwise, do a 
        # prerelease (beta)
        run: |
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            npx lerna version "${VERSION_OVERRIDE}" --conventional-commits --no-git-tag-version --scope "packages/plugins" --yes --loglevel silly
          else
            npm lerna version "${VERSION_OVERRIDE}" --conventional-prerelease --preid beta --scope "packages/plugins" --no-git-tag-version --yes --loglevel silly
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_VERSIONING: ${{ inputs.skip_versioning }}
        run: |
          if [ "${SKIP_VERSIONING}" = "true" ]; then
            npx lerna publish from-package --yes --loglevel silly
          else
            npx lerna publish from-git --yes --loglevel silly
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('.packages/blockly/package.json').version")
          TARBALL="blockly-${VERSION}.tgz"
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            gh release create "blockly-v${VERSION}" "$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --title "blockly-v${VERSION}" \
              --generate-notes \
              --prerelease
          else
            gh release create "blockly-v${VERSION}" "$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --title "blockly-v${VERSION}" \
              --generate-notes
          fi
