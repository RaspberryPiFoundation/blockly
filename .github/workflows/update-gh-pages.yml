# Manual workflow to update GitHub Pages from a chosen source branch.
# scripts/update_github_pages.mjs builds the repo and force-pushes to gh-pages.

name: Update GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to build and deploy to GitHub Pages'
        required: true
        type: string
        default: main

permissions:
  contents: write

jobs:
  update-gh-pages:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      # This uses a reverse-engineered email for the github actions bot. See
      # https://github.com/actions/checkout/issues/13#issuecomment-724415212
      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Npm Clean Install
        run: npm ci

      - name: Update GitHub Pages
        working-directory: ./packages/blockly
        run: npm run updateGithubPages:staging
