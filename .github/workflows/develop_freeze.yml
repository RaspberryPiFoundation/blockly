# This workflow will comment on pull requests that are submitted while main
# is frozen during the week of release. Skips any pull requests that have the
# label 'ignore-freeze'.
# This workflow should be enabled only while main is frozen.

name: Main Freeze PR Comment

on:
  # Trigger the workflow on pull request on main branch
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - main

jobs:
  freeze-comment:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ignore-freeze') }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Comment
        uses: github-actions-up-and-running/pr-comment@f1f8ab2bf00dce6880a369ce08758a60c61d6c0b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message: 'Thanks for the PR! The main branch is currently frozen in preparation for the release so it may not be addressed until after release week.'
